<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d17">
  <title>Monstres</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #100d17; color: #e8e6f0;
                 font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
    #hud { flex: 1; min-width: 12em; }
    button { font: inherit; color: inherit; background: #2a2638; border: 1px solid #443e5a;
             border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button:hover { background: #363049; }
    #canvas { flex: 1; width: 100%; min-height: 0; display: block; outline: none; }
  </style>
</head>
<body>
  <header>
    <div id="hud">Chargement…</div>
    <button id="export" type="button">Exporter la sauvegarde</button>
    <button id="import" type="button">Importer</button>
    <input id="import-file" type="file" accept=".sav,application/octet-stream" hidden>
  </header>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var Module = { canvas: document.getElementById('canvas') };

    document.getElementById('export').addEventListener('click', () => window.monstres?.exportSave());
    const fileInput = document.getElementById('import-file');
    document.getElementById('import').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      fileInput.value = '';
      if (file && !(await window.monstres?.importSave(file))) {
        alert("Ce fichier n'est pas une sauvegarde Monstres valide.");
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service Worker :', e));
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
